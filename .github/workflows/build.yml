name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this tag (e.g. v0.3.1), or leave empty to only build'
        required: false
        default: ''

jobs:
  mac:
    # Intel runner: the Apple Silicon ones are often out of capacity; it still builds the universal app
    runs-on: macos-15-intel
    env:
      # signed and notarized when these secrets exist, ad-hoc signed otherwise (scripts/after-pack.js)
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mac helper
        run: |
          npm run build:helper
          lipo -archs native/mac-helper/bin/capri-mac-helper
          native/mac-helper/bin/capri-mac-helper apps
          native/mac-helper/bin/capri-mac-helper watch 0 $$ > watch.log &
          sleep 2; kill $! || true
          head -c 600 watch.log; echo
          test -s watch.log
      - name: Package
        run: npx electron-builder --mac --publish never
      - name: Check the app
        run: |
          APP=dist/mac-universal/Capri.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Capri"
          test -x "$APP/Contents/Resources/bin/capri-mac-helper"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: capri-mac
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: capri-windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # from a tag push, its own tag; from the Actions tab, the tag typed there (created on this commit)
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
